<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Blue Login Redesign</title>
  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, #001f3f, #004080, #0074d9, #00bfff, #1e90ff, #4b0082);
      background-size: 500% 500%;
      animation: gradientShift 10s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Curved White Layout */
    .curve {
      position: absolute;
      left: 0;
      width: 55%;
      height: 100%;
      background: #ffffff;
      border-top-right-radius: 60% 100%;
      border-bottom-right-radius: 60% 100%;
      box-shadow: 5px 0 25px rgba(0, 0, 0, 0.25);
      z-index: 1;
    }

    /* Floating Circles with Gradient Blues */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at top left, #00bfff, #002147);
      opacity: 0.45;
      filter: blur(3px);
      animation: float 7s infinite ease-in-out alternate;
    }

    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(-25px); }
    }

    .circle.one { width: 130px; height: 130px; top: 15%; right: 15%; animation-delay: 0s; }
    .circle.two { width: 90px; height: 90px; bottom: 20%; right: 30%; animation-delay: 1s; }
    .circle.three { width: 70px; height: 70px; top: 40%; right: 40%; animation-delay: 2s; }

    /* Music Symbols (Animated 🎵🎶🎼) */
    .music-symbol {
      position: absolute;
      font-size: 32px;
      color: rgba(255, 255, 255, 0.6);
      animation: moveNotes 7s infinite linear alternate;
    }

    .music-symbol:nth-child(1) { top: 20%; right: 10%; animation-delay: 0s; }
    .music-symbol:nth-child(2) { top: 60%; right: 25%; animation-delay: 1s; }
    .music-symbol:nth-child(3) { top: 80%; right: 15%; animation-delay: 2s; }

    @keyframes moveNotes {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(-40px) rotate(15deg); opacity: 0.5; }
    }

    /* Navbar */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 80px;
      z-index: 3;
    }

    header .logo {
      display: flex;
      align-items: center;
      font-weight: 700;
      font-size: 20px;
      color: #0074d9;
    }

    header .logo span {
      margin-left: 8px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 25px;
      font-size: 15px;
      font-weight: 500;
      transition: 0.3s;
    }

    nav a:hover,
    nav a.active {
      color: #00bfff;
      border-bottom: 2px solid #00bfff;
      padding-bottom: 3px;
    }

    /* Login Box */
    .login-box {
      position: absolute;
      left: 10%;
      top: 50%;
      transform: translateY(-50%);
      width: 320px;
      color: #333;
      z-index: 2;
    }

    .login-box h2 {
      color: #0074d9;
      margin-bottom: 25px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .login-box label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #333;
      font-weight: 600;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-bottom: 2px solid #999;
      outline: none;
      font-size: 14px;
      background: transparent;
      transition: 0.3s;
    }

    .login-box input:focus {
      border-bottom: 2px solid #0074d9;
    }

    .remember {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #555;
      margin-bottom: 20px;
    }

    .remember input {
      margin-right: 6px;
    }

    .btns {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .login-btn {
      background: linear-gradient(135deg, #0074d9, #00bfff);
      color: #fff;
      border: none;
      padding: 10px 30px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0px 0px 10px rgba(0, 116, 217, 0.4);
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #0099ff, #1e90ff);
      box-shadow: 0px 0px 15px rgba(0, 191, 255, 0.7);
    }

    .create-btn {
      background: transparent;
      color: #0074d9;
      border: 2px solid #0074d9;
      padding: 9px 20px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .create-btn:hover {
      background: #0074d9;
      color: #fff;
    }

    @media (max-width: 768px) {
      header {
        padding: 15px 30px;
      }
      .curve {
        width: 100%;
        border-radius: 0;
      }
      .login-box {
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .circle, .music-symbol {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header>
    <div class="logo">
      🎵<span>Spotify</span>
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Premium</a>
      <a href="#">About</a>
      <a href="#" class="active">Login</a>
    </nav>
  </header>

  <!-- Curved Layout -->
  <div class="curve"></div>

  <!-- Floating Backgrounds -->
  <div class="circle one"></div>
  <div class="circle two"></div>
  <div class="circle three"></div>
  <div class="music-symbol">🎶</div>
  <div class="music-symbol">🎵</div>
  <div class="music-symbol">🎼</div>

  <!-- Login Box -->
  <div class="login-box">
    <h2>Login</h2>
    <form>
      <label>Email</label>
      <input type="email" placeholder="enteryour@gmail.com" required>

      <label>Password</label>
      <input type="password" placeholder="" required>

      <div class="remember">
        <input type="checkbox" id="remember">
        <label for="remember">Remember Me</label>
      </div>

      <div class="btns">
        <button type="submit" class="login-btn">Login</button>
        <button type="button" class="create-btn">Create Account</button>
      </div>
    </form>
  </div>
</body>
</html>
